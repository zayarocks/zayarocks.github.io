<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>zaya.rocks</title>

<style>
:root {
  --ink:  #191614;
  --gold: #f4d660;
  --mono: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;

  --cols: repeating-linear-gradient(to right,
      rgb(255 255 255 / .03)  0      4.17%, rgb(0 0 0 / .10)  4.17%  8.33%,
      rgb(255 255 255 / .09)  8.33% 12.5%,  rgb(0 0 0 / .07) 12.5%  16.67%,
      rgb(255 255 255 / .15) 16.67% 20.83%, rgb(0 0 0 / .04) 20.83% 25%);
}

html { color: #ffffff; font: 17px/1.55 var(--mono) }
body { margin: 0; overflow: hidden }

header {
  height: 100dvh;
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr);
}

/*  the rings widen and close again, very slowly, so the whole field
    swells out of the bar and settles back into it. it is one property
    on two elements — background-size — rather than anything moving,
    and the hard stops mean the rings stay flat while they travel.  */

.field {
  animation: ripple 54s cubic-bezier(.45,0,.55,1) infinite alternate;
  /*  two layers, so every one of these needs two values. a single
      background-size stretches the column overlay to the full width
      as well, which turns the fine columns into one bar each — the
      first value is the columns, the second is the rings.  */
  background-size:     auto, 100% 100%;
  background-repeat:   repeat, no-repeat;
  background-position: 0 0, 50% 100%;
  background-image: var(--cols), radial-gradient(circle at 50% 100%,
      #f4d660 0.00% 8.33%,
      #cad45d 8.33% 16.67%,
      #99d06a 16.67% 25.00%,
      #5ec97d 25.00% 33.33%,
      #00c093 33.33% 41.67%,
      #00b2a7 41.67% 50.00%,
      #00a1b8 50.00% 58.33%,
      #008dc3 58.33% 66.67%,
      #0076c6 66.67% 75.00%,
      #2e5dc1 75.00% 83.33%,
      #4d44b1 83.33% 91.67%,
      #5e2b9a 91.67% 100.00%);
  background-blend-mode: soft-light;
}

/*  rings from the point where the bar meets the colour, so the two
    halves are one circle cut in half by the name  */

.field:last-of-type { transform: scaleY(-1); animation-delay: -27s }

@keyframes ripple {
  from { background-size: auto, 100% 100% }
  to   { background-size: auto, 190% 190% }
}

@media (prefers-reduced-motion: reduce) { .field { animation: none } }

pre {
  margin: 0;
  padding: 1.1em max(1.25rem, calc(50% - 14.5ch));
  background: var(--ink);
  border-block: 4px solid var(--ink);
  font-family: inherit;
  font-size: min(30px, calc((100vw - 40px) / 17.4), 7dvh);
  line-height: 1;
}

.tld { color: var(--gold) }

@supports (background-clip: text) or (-webkit-background-clip: text) {
  .tld {
    color: transparent;
    -webkit-text-fill-color: transparent;
    background-image: linear-gradient(90deg,
      #f4d660, #ffb3d9, #b3e0ff, #c9f0a0, #ffd28a, #f4d660);
    background-size: 220% 100%;
    background-position: 0 0;
    -webkit-background-clip: text;
            background-clip: text;
    transition: background-position 14s ease-out;
  }
  pre:hover .tld { background-position: -110% 0 }
}

.visually-hidden {
  position: absolute; width: 1px; height: 1px; margin: -1px;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap;
}

</style>

</head>
<body>

<header>
  <div class="field" aria-hidden="true"></div>
  <h1 class="visually-hidden">zaya.rocks</h1>
  <pre aria-hidden="true">            <span class="tld">           ▌     </span>
▀▜▘▝▀▖▌ ▌▝▀▖<span class="tld">  ▙▀▖▞▀▖▞▀▖▌▗▘▞▀▘</span>
▗▘ ▞▀▌▚▄▌▞▀▌<span class="tld">▗▖▌  ▌ ▌▌ ▖▛▚ ▝▀▖</span>
▀▀▘▝▀▘▗▄▘▝▀▘<span class="tld">▝▘▘  ▝▀ ▝▀ ▘ ▘▀▀ </span></pre>
  <div class="field" aria-hidden="true"></div>
</header>

</body>
</html>
