<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>http://zaya.rocks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cutive+Mon" rel="stylesheet">
<style>
:root { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
* { box-sizing: border-box }
html, body { margin: 0; height: 100%; background: #000; }
body {
  display: grid;
  place-items: center;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  position: relative;
}

/* faint scanlines for CRT/terminal feel */
body::before {
  content: "";
  position: absolute; inset: 0;
  background: repeating-linear-gradient(0deg,
    rgb(255 255 255 / .025) 0 1px, transparent 1px 3px);
  pointer-events: none;
}

.prompt {
  font-family: 'Cutive Mono', ui-monospace, monospace;;
  font-weight: 400;
  font-size: clamp(1.6rem, 8vw, 4.5rem);
  white-space: nowrap;
  letter-spacing: 0;
}

.proto {
  color: #3a5a5e;
}

.zaya {
  color: #f4d660;
  text-shadow: 0 0 6px currentColor;
  animation: shift 24s linear infinite;
}
@keyframes shift {
  0%   { color: #f4d660 }
  20%  { color: #00c093 }
  40%  { color: #0076c6 }
  60%  { color: #5e2b9a }
  80%  { color: #cad45d }
  100% { color: #f4d660 }
}

.rocks {
  color: #baf6ff;
  text-shadow: 0 0 3px rgb(186 246 255 / .4);
}

.cursor {
  color: #baf6ff;
  animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0 } }

@media (prefers-reduced-motion: reduce) {
  .zaya { animation: none; color: #f4d660; }
  .cursor { animation: none; }
}
</style>
</head>
<body>
  <div class="prompt"><span class="proto">http://</span><span class="zaya">zaya</span><span class="rocks">.rocks</span><span class="cursor">_</span></div>
</body>
</html>
