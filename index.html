<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>zaya.rocks</title>
<style>
:root { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
* { box-sizing: border-box }
html, body { margin: 0; height: 100%; background: #000; }
body {
  display: grid;
  place-items: center;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  position: relative;
}

/* faint scanlines for CRT/terminal feel */
body::before {
  content: "";
  position: absolute; inset: 0;
  background: repeating-linear-gradient(0deg,
    rgb(255 255 255 / .025) 0 1px, transparent 1px 3px);
  pointer-events: none;
}

.prompt {
  font-family: 'Courier New', ui-monospace, monospace;
  font-weight: 400;
  font-size: clamp(1.6rem, 8vw, 4.5rem);
  white-space: nowrap;
  letter-spacing: 0;
}

.proto {
  color: #3a5a5e;
}

.zaya {
  background-image: linear-gradient(90deg,
    #f4d660,#cad45d,#99d06a,#5ec97d,#00c093,#00b2a7,
    #00a1b8,#008dc3,#0076c6,#2e5dc1,#4d44b1,#5e2b9a,#f4d660);
  background-size: 300% 100%;
  color: transparent;
  -webkit-text-fill-color: transparent;
  -webkit-background-clip: text;
  background-clip: text;
  text-shadow: 0 0 14px rgb(244 214 96 / .5);
  animation: flow 10s linear infinite;
}
@keyframes flow {
  to { background-position: -300% 0; }
}

.rocks {
  color: #baf6ff;
  text-shadow: 0 0 6px rgb(186 246 255 / .45);
}

.cursor {
  color: #baf6ff;
  animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0 } }

@media (prefers-reduced-motion: reduce) {
  .zaya { animation: none; background-position: 0 0; }
  .cursor { animation: none; }
}
</style>
</head>
<body>
  <div class="prompt"><span class="proto">http://</span><span class="zaya">zaya</span><span class="rocks">.rocks</span><span class="cursor">_</span></div>
</body>
</html>
